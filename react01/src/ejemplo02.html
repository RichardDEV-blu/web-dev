<html>
<head>
    <title>Ejemplo01</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function (){
            var text = "mundo!!!!";
            var something = "<p>¡Nuevo elemento!</p>";

            $("#miBoton").click(function (){
                if(text === "mundo!!!!"){
                    text = "universo";
                } else {
                    text = "mundo!!!!";
                }

                $("#miSpan").text(text);
                $("#root").append(something);
            });
        });
    </script>
</head>
<body>

Hola <span id="miSpan">mundo!!!!</span>
<br/>
<button id="miBoton">Click me</button>

<div id="root" style="border: 1px solid black">
    ROOT
</div>

</body>
</html>
